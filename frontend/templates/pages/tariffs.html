{{define "content"}}
<div class="page-head">
  <h1>Тарифы</h1>
  <button class="btn btn-primary" type="button" data-action="add">Добавить тариф</button>
</div>
<p class="notice">Новая цена действует для новых бронирований. В уже созданных арендах хранятся цены на момент бронирования.</p>
<div class="table-wrap">
  <table id="tariffs-table">
    <caption class="visually-hidden">Тарифы</caption>
    <thead>
      <tr>
        <th class="num" scope="col">№</th>
        <th scope="col">Название</th>
        <th class="num" scope="col">Минута поездки</th>
        <th class="num" scope="col">Минута ожидания</th>
        <th class="num" scope="col">Автомобилей</th>
        <th scope="col"><span class="visually-hidden">Действия</span></th>
      </tr>
    </thead>
    <tbody><tr><td class="table-empty">Загрузка…</td></tr></tbody>
  </table>
</div>
{{end}}
