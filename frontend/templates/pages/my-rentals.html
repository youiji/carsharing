{{define "head"}}{{template "map-head" .}}{{end}}
{{define "content"}}
<div class="page-head">
  <h1>Мои аренды</h1>
  <a class="btn btn-secondary" href="/catalog">Каталог автомобилей</a>
</div>

<section class="current-rental-section" aria-labelledby="current-title">
  <h2 id="current-title">Текущая аренда</h2>
  <div class="current-rental"><p class="muted">Загрузка…</p></div>
</section>

<section aria-labelledby="history-title">
  <div class="section-head">
    <h2 id="history-title">История</h2>
    <div class="field field-inline">
      <label for="status">Статус</label>
      <select id="status">
        <option value="">Все</option>
        <option value="completed">Завершённые</option>
        <option value="cancelled">Отменённые</option>
        <option value="active">В поездке</option>
        <option value="booked">Бронирования</option>
      </select>
    </div>
  </div>
  <div class="table-wrap">
    <table id="history-table">
      <caption class="visually-hidden">История аренд</caption>
      <thead>
        <tr>
          <th data-sort="id" class="num" scope="col">№</th>
          <th scope="col">Автомобиль</th>
          <th data-sort="booked_at" scope="col">Бронирование</th>
          <th scope="col">Поездка</th>
          <th class="num" scope="col">Длительность</th>
          <th data-sort="total_cost" class="num" scope="col">Стоимость</th>
          <th data-sort="status" scope="col">Статус</th>
        </tr>
      </thead>
      <tbody><tr><td class="table-empty">Загрузка…</td></tr></tbody>
    </table>
  </div>
</section>
{{end}}
