{{define "content"}}
<section class="auth-box">
  <h1>Регистрация</h1>
  <p class="muted">ФИО и водительское удостоверение указываются один раз: изменить их сможет только администратор.</p>
  <form class="form" id="register-form" novalidate>
    <div class="field">
      <label for="full_name">ФИО</label>
      <input id="full_name" name="full_name" autocomplete="name" required minlength="2" maxlength="100">
      <p class="field-error" data-error-for="full_name"></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="100">
      <p class="field-error" data-error-for="email"></p>
    </div>
    <div class="field">
      <label for="driver_license">Водительское удостоверение</label>
      <input id="driver_license" name="driver_license" inputmode="numeric" placeholder="7712 345678" required maxlength="11">
      <p class="field-hint">Серия и номер: 10 цифр</p>
      <p class="field-error" data-error-for="driver_license"></p>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
      <p class="field-hint">Не менее 8 символов</p>
      <p class="field-error" data-error-for="password"></p>
    </div>
    <div class="field">
      <label for="password2">Повторите пароль</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
      <p class="field-error" data-error-for="password2"></p>
    </div>
    <p class="form-error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Зарегистрироваться</button>
  </form>
  <p class="auth-switch">Уже есть учётная запись? <a href="/login">Войдите</a></p>
</section>
{{end}}
