{{define "content"}}
<div class="page-head">
  <h1>Пользователи и роли</h1>
</div>

<form class="toolbar" id="filters" role="search">
  <div class="field field-grow">
    <label for="q">Поиск</label>
    <input id="q" name="q" type="search" placeholder="ФИО или email" autocomplete="off">
  </div>
  <div class="field">
    <label for="role">Роль</label>
    <select id="role" name="role">
      <option value="">Все роли</option>
      <option value="client">Клиент</option>
      <option value="manager">Менеджер</option>
      <option value="admin">Администратор</option>
    </select>
  </div>
</form>

<div class="table-wrap">
  <table id="users-table">
    <caption class="visually-hidden">Пользователи</caption>
    <thead>
      <tr>
        <th data-sort="id" class="num" scope="col">№</th>
        <th data-sort="full_name" scope="col">ФИО</th>
        <th data-sort="email" scope="col">Email</th>
        <th scope="col">Водительское удостоверение</th>
        <th scope="col">Роль</th>
        <th data-sort="created_at" scope="col">Регистрация</th>
        <th scope="col"><span class="visually-hidden">Действия</span></th>
      </tr>
    </thead>
    <tbody><tr><td class="table-empty">Загрузка…</td></tr></tbody>
  </table>
</div>
<p class="table-footer users-count"></p>
{{end}}
