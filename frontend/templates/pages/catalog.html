{{define "head"}}{{template "map-head" .}}
  <link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
  <script defer src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
{{end}}
{{define "content"}}
<div class="page-head">
  <h1>Каталог и карта</h1>
  <p class="muted catalog-count" aria-live="polite"></p>
</div>

<div class="alert alert-info open-rental-note" hidden></div>

<form class="toolbar" id="filters" role="search">
  <div class="field field-grow">
    <label for="q">Поиск</label>
    <input id="q" name="q" type="search" placeholder="Марка, модель или гос. номер" autocomplete="off">
  </div>
  <div class="field">
    <label for="tariff_id">Тариф</label>
    <select id="tariff_id" name="tariff_id"><option value="">Все тарифы</option></select>
  </div>
  <div class="field" data-show="manager admin" hidden>
    <label for="status">Статус</label>
    <select id="status" name="status">
      <option value="">Все статусы</option>
      <option value="available">Свободен</option>
      <option value="booked">Забронирован</option>
      <option value="in_use">В поездке</option>
      <option value="maintenance">На обслуживании</option>
      <option value="decommissioned">Списан</option>
    </select>
  </div>
  <button class="btn btn-secondary" type="reset">Сбросить</button>
</form>

<div id="map" class="map" aria-label="Карта автомобилей"></div>

<div class="table-wrap">
  <table id="cars-table">
    <caption class="visually-hidden">Автомобили</caption>
    <thead>
      <tr>
        <th data-sort="brand_model" scope="col">Автомобиль</th>
        <th data-sort="plate_number" scope="col">Гос. номер</th>
        <th data-sort="fuel_level" scope="col">Топливо</th>
        <th scope="col">Тариф</th>
        <th data-sort="price_per_min" class="num" scope="col">Цена минуты</th>
        <th class="num" scope="col">Минута ожидания</th>
        <th scope="col" data-show="manager admin" hidden>Статус</th>
        <th scope="col" data-show="client" hidden><span class="visually-hidden">Действия</span></th>
      </tr>
    </thead>
    <tbody><tr><td class="table-empty">Загрузка…</td></tr></tbody>
  </table>
</div>
{{end}}
